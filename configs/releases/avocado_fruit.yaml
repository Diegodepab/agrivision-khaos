descriptions:
  en: 'A comprehensive image dataset of avocado fruit (*Persea americana*) intended
    for artificial intelligence models in precision agriculture, automated post-harvest
    grading, phenological ripening tracking, and phytopathological quality control.
    It contains {total_images:,} images, integrating 3 open scientific repositories
    (Campos-Ferreira & González-Camacho Agrociencia paper, Mendeley Hass Ripening
    Photographic Dataset, and UC Riverside Roboflow in-field detection) after rigorous
    curation. The dataset features a multi-attribute hierarchy: photographic monitoring
    across 5 standardized Hass ripening stages (hard/unripe, breaking, firm ripe,
    ready-to-eat, overripe), fine-grained defect and disease classification (healthy
    fruit vs. scab/roña [*Sphaceloma perseae*] and anthracnose [*Colletotrichum*]),
    and in-field fruit localization and segmentation on tree branches. Partitioned
    into zero-leakage splits (80% train, 10% validation, 10% test). Can be used in
    computer vision, deep learning, automated packing line sorting, smart harvesting
    robotics, and food quality inspection.

    The license is CC BY 4.0.'
  es: 'Macro-conjunto de datos de imágenes de fruto de aguacate (*Persea americana*)
    destinado al desarrollo de modelos de inteligencia artificial en agricultura de
    precisión, calibración post-cosecha, seguimiento de maduración fenológica y control
    fitopatológico de calidad. Contiene {total_images:,} imágenes procedentes de la
    integración de 3 repositorios científicos abiertos (artículo en Agrociencia de
    Campos-Ferreira y González-Camacho, Dataset Fotográfico Mendeley de Maduración
    Hass y detección en campo de UC Riverside en Roboflow) tras un riguroso control
    de calidad. Presenta una jerarquía multi-atributo: clasificación en 5 estadíos
    estandarizados de maduración Hass (inmaduro duro, viraje, maduro firme, listo
    para consumo y sobremaduro), clasificación de defectos y patologías comerciales
    (fruto sano frente a roña [*Sphaceloma perseae*] y antracnosis [*Colletotrichum*])
    y detección/segmentación espacial de fruto en árbol. Particionado sin fuga de
    datos (80% entrenamiento, 10% validación, 10% test). Puede utilizarse en visión
    artificial, calibradoras ópticas agroalimentarias, robótica de recolección y control
    de calidad.

    La licencia es CC BY 4.0.'
ontology_explanation: 'El dataset organiza el fruto de aguacate bajo una ontología
  multi-atributo:

  - **Estadíos de Maduración Fenológica:** Clasificación en 5 fases estandarizadas
  de firmeza e índice de maduración Hass (`inmaduro_duro`, `viraje_color`, `maduro_firme`,
  `maduro_consumo`, `sobremaduro`).

  - **Inspección de Calidad Fitosanitaria y Defectos:** Discriminación entre fruto
  sano (`sano`) frente a patologías comerciales: roña/sarna (`sarna_rona` / *Sphaceloma
  perseae*) y antracnosis (`antracnosis` / *Colletotrichum*).

  - **Localización Espacial en Árbol:** Detección y delimitación de instancias de
  `aguacate` en condiciones naturales de huerto.'
