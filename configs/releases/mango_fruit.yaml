descriptions:
  en: 'An image dataset of mango fruit (*Mangifera indica*) intended for artificial
    intelligence models in precision agriculture, agri-food quality control, post-harvest
    sorting, and cultivar identification. It contains {total_images:,} images across
    17 classes, integrating 2 open scientific repositories from Mendeley Data (MangoDHDS
    and MangoImageBD) after rigorous visual quality curation and deduplication. The
    dataset features a multi-tiered hierarchy: identification of 15 commercial cultivars
    (Amrapali, Ashshina Classic, Ashshina Zhinuk, Banana Mango, Bari-11, Bari-4, Fazli
    Classic, Fazli Shurmai, Gourmoti, Harivanga, Himsagor, Katimon, Langra, Rupali,
    Shada) and fine-grained post-harvest pathology classification (healthy fruit vs.
    anthracnose, bacterial canker, scab, and stem end rot). Partitioned into zero-leakage
    splits (80% train, 10% validation, 10% test). Can be used in computer vision,
    deep learning, automated optical sorting machinery, and fruit quality assessment.

    The license is CC BY 4.0.'
  es: 'Conjunto de datos de imágenes de fruto de mango (*Mangifera indica*) destinado
    al desarrollo y evaluación de modelos de inteligencia artificial en agricultura
    de precisión, control de calidad agroalimentario, calibración post-cosecha e identificación
    varietal. Contiene {total_images:,} imágenes organizadas en 17 clases, integrando
    2 repositorios científicos abiertos de Mendeley Data (MangoDHDS y MangoImageBD)
    tras un exhaustivo filtrado de calidad y deduplicación visual. Presenta una jerarquía
    dual: tipificación de 15 cultivares y variedades comerciales de mango (Amrapali,
    Ashshina Classic, Ashshina Zhinuk, Banana Mango, Bari-11, Bari-4, Fazli Classic,
    Fazli Shurmai, Gourmoti, Harivanga, Himsagor, Katimon, Langra, Rupali, Shada)
    e inspección fitopatológica post-cosecha (frutos sanos frente a antracnosis, chancro
    bacteriano, roña/sarna y pudrición peduncular). Particionado sin fuga de datos
    (80% entrenamiento, 10% validación, 10% test). Puede utilizarse en visión artificial,
    aprendizaje profundo, calibradoras ópticas industriales y robótica agroalimentaria.

    La licencia es CC BY 4.0.'
ontology_explanation: 'El dataset organiza el fruto de mango bajo una ontología fitosanitaria
  y varietal:

  - **Inspección de Patologías y Defectos Post-Cosecha:** Clasificación diagnóstica
  entre frutos sanos (`sano`), antracnosis (`antracnosis`), chancro bacteriano (`chancro_bacteriano`),
  roña/sarna (`rona_sarna`) y pudrición peduncular (`pudricion_peduncular`).

  - **Identificación de Cultivares y Variedades Comerciales:** Tipificación de 15
  variedades de mango para clasificación agronómica e industrial (`variedad_amrapali`,
  `variedad_ashshina`, `variedad_banana`, `variedad_bari`, `variedad_fazli`, `variedad_gourmoti`,
  `variedad_harivanga`, `variedad_himsagor`, `variedad_katimon`, `variedad_langra`,
  `variedad_rupali`, `variedad_shada`).'
