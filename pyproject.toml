[project]
name = "agrivision-khaos"
version = "0.1.0"
description = "Federated data-centric AI node for agricultural computer vision pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fiftyone>=1.19.0",
    "numpy>=2.5.1",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.13.4",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
cu130 = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ruff>=0.13.0",
]
docs = [
    "zensical>=0.0.17",
]

[project.scripts]
agrivision-ingest = "agrivision_khaos.ingest:main"
agrivision-quality = "agrivision_khaos.quality:main"
agrivision-deduplicate = "agrivision_khaos.deduplication:main"
agrivision-pipeline = "agrivision_khaos.pipeline:main"
agrivision-export = "agrivision_khaos.export:main"
agrivision-mock = "agrivision_khaos.synthetic:main"
agrivision-preflight = "agrivision_khaos.preflight:main"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agrivision_khaos*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
